# /etc/mosquitto/mosquitto.conf
# ═══════════════════════════════════════════════════════════
# UNS MQTT Broker — Mosquitto 設定檔
# ═══════════════════════════════════════════════════════════
#
# 此設定檔配合 acl.conf 使用，提供：
#   - TLS 加密（port 8883）
#   - Username/Password 認證
#   - 設備級 ACL 授權
#   - Localhost 開發用明文連線（port 1883）
#
# 部署步驟：
#   1. 產生 TLS 憑證（見下方說明）
#   2. 建立密碼檔: mosquitto_passwd -c /etc/mosquitto/passwords <user>
#   3. 複製此檔案到 /etc/mosquitto/mosquitto.conf
#   4. 啟動 Broker: mosquitto -c /etc/mosquitto/mosquitto.conf
#

# ─── 全域設定 ──────────────────────────────────────────────

# 不允許匿名連線
allow_anonymous false

# 密碼檔（所有 user 的 credential）
password_file /etc/mosquitto/passwords

# ACL 存取控制
acl_file /etc/mosquitto/acl.conf

# 持久化 session（支援 QoS 1/2 的離線訊息保留）
persistence true
persistence_location /var/lib/mosquitto/

# 日誌
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
# log_type information    # 除錯時開啟
# log_type debug          # 除錯時開啟


# ─── TLS 加密連線（Production） ────────────────────────────
# Port 8883：所有對外連線都走 TLS

listener 8883
protocol mqtt

# TLS 憑證
cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile  /etc/mosquitto/certs/server.key

# 最低 TLS 版本
tls_version tlsv1.3

# 未來啟用 X.509 client certificate 認證時，取消以下註解：
# require_certificate true
# use_identity_as_username true


# ─── Localhost 明文連線（開發/除錯） ───────────────────────
# Port 1883：僅綁定 localhost，不對外開放
# ⚠ Production 環境應移除此段

listener 1883 127.0.0.1
protocol mqtt


# ─── WebSocket（可選，給 Dashboard 用） ───────────────────
# Port 9883：WebSocket over TLS（如果 Dashboard 需要直連 Broker）
# 大多數情況下 Dashboard 走 gRPC Query Service，不直連 Broker

# listener 9883
# protocol websockets
# cafile   /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile  /etc/mosquitto/certs/server.key


# ─── 效能調校 ─────────────────────────────────────────────

# 最大同時連線數
max_connections -1

# 單一訊息最大大小（256KB，足夠 JSON payload）
message_size_limit 262144

# Retained message 最大數量
# max_queued_messages 10000

# Inflight window（同時處理的 QoS 1/2 訊息數）
max_inflight_messages 20


# ═══════════════════════════════════════════════════════════
# TLS 憑證產生指南（Self-Signed，開發用）
# ═══════════════════════════════════════════════════════════
