# openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
#     -CAcreateserial -out server.crt -days 365
#
# # 4. 複製到 /etc/mosquitto/certs/
# mkdir -p /etc/mosquitto/certs
# cp ca.crt server.crt server.key /etc/mosquitto/certs/
