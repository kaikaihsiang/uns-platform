version: "3.9"

# =============================================================================
# CDC MES Bridge — Docker Compose
# =============================================================================
# 啟動 Debezium CDC 所需的基礎設施：
#   1. MES PostgreSQL（模擬 MES DB）
#   2. Kafka + Zookeeper（Debezium 的傳輸層）
#   3. Debezium Connect（CDC 引擎）
#   4. MQTT Broker（UNS）
#
# 使用方式：docker-compose up -d
# =============================================================================

services:
  # ─── MES PostgreSQL（模擬 MES DB）───
  mes-postgres:
    image: postgres:15
    container_name: mes-postgres
    environment:
      POSTGRES_DB: mes_db
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: mes_password
    ports:
      - "5433:5432"
    volumes:
      - mes_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"        # Debezium 必要：啟用邏輯複製
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"

  # ─── UNS TimescaleDB ───
  uns-timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: uns-timescaledb
    environment:
      POSTGRES_DB: uns_timeseries
      POSTGRES_USER: uns
      POSTGRES_PASSWORD: uns_password
    ports:
      - "5434:5432"
    volumes:
      - uns_data:/var/lib/postgresql/data

  # ─── Zookeeper（Kafka 依賴）───
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ─── Kafka（Debezium 的傳輸層）───
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  # ─── Debezium Connect（CDC 引擎）───
  debezium-connect:
    image: debezium/connect:2.4
    container_name: debezium-connect
    depends_on:
      - kafka
      - mes-postgres
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"

  # ─── MQTT Broker（UNS）───
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  mes_data:
  uns_data:
