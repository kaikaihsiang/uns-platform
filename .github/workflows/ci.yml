name: UNS Platform CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      
      - name: Run Ruff check on Backend
        run: ruff check backend/app
        
      - name: Run Ruff check on Data Engine
        run: ruff check data-engine/src data-engine/tests

  test-data-engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: uns_admin
          POSTGRES_PASSWORD: uns_dev_password
          POSTGRES_DB: uns_timeseries
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        working-directory: ./data-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-env
          
      - name: Run unit tests
        working-directory: ./data-engine
        run: pytest tests/ -v --ignore=tests/test_e2e_semantic_layer.py
