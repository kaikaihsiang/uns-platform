# =============================================================================
# UNS 系統設定檔範例
# =============================================================================
# 此檔案定義 UNS 系統的運行參數，包含 MQTT 連線、資料庫、
# 資料保留策略、告警閾值等設定。
# 
# 用途：作為 uns_prototype.py 的外部設定檔參考
# =============================================================================

# --- 系統基本設定 ---
system:
  name: "UNS Namespace Manager"
  version: "1.0.0"
  language: "zh-TW"
  log_level: "INFO"          # DEBUG | INFO | WARNING | ERROR
  log_file: "uns_output.log"

# --- MQTT Broker 連線設定 ---
mqtt:
  # 主要 Broker
  primary:
    host: "mqtt.factory-internal.local"  # 正式環境使用內部 Broker
    port: 1883
    # TLS 設定（正式環境務必啟用）
    tls:
      enabled: false
      ca_cert: "/etc/mqtt/certs/ca.crt"
      client_cert: "/etc/mqtt/certs/client.crt"
      client_key: "/etc/mqtt/certs/client.key"
    # 認證
    auth:
      username: "uns_service"
      password: "${MQTT_PASSWORD}"   # 從環境變數讀取，不要寫死
    # 連線參數
    client_id: "uns_backend_service"
    clean_session: true
    keepalive_seconds: 60

  # 測試用 Broker（僅開發時使用）
  test:
    host: "test.mosquitto.org"
    port: 1883
    tls:
      enabled: false
    auth:
      username: null
      password: null

  # 訂閱設定
  subscriptions:
    # 訂閱的 topic 前綴
    - topic: "uns/#"
      qos: 1
      description: "主要 UNS 命名空間"
    # 若需要監聽 Sparkplug B 設備
    # - topic: "spBv1.0/#"
    #   qos: 1
    #   description: "Sparkplug B 設備發現"
  
  # 重連策略
  reconnect:
    enabled: true
    initial_delay_seconds: 1
    max_delay_seconds: 60
    backoff_multiplier: 2      # 指數退避

# --- 資料庫設定 ---
database:
  type: "sqlite"
  path: "uns_data.db"
  # 連線池設定（未來若遷移到 PostgreSQL）
  # pool_size: 5
  # max_overflow: 10

  # 資料保留策略
  retention:
    # 主 topics 表：只保留最新狀態
    topics:
      max_count: 5000           # 最多保留的 topic 數量
      max_age_hours: 168        # 超過 7 天未更新的 topic 自動清除

    # 歷史紀錄表（若啟用）
    history:
      enabled: false            # 未來功能：啟用歷史紀錄存儲
      max_records_per_topic: 1000
      max_age_days: 30
      # 降取樣設定
      downsampling:
        enabled: false
        raw_retention_hours: 24     # 24 小時內保留原始數據
        minute_avg_retention_days: 7  # 7 天內保留分鐘平均
        hour_avg_retention_days: 90   # 90 天內保留小時平均

  # 資料庫維護
  maintenance:
    cleanup_interval_seconds: 3600   # 每小時清理一次
    vacuum_after_cleanup: true       # 清理後回收磁碟空間

# --- Heartbeat 設定 ---
heartbeat:
  interval_seconds: 5
  # 透過 MQTT 發布 heartbeat
  publish:
    enabled: true
    topic: "uns/_system/heartbeat"
    payload_template:
      service: "uns_backend"
      status: "alive"

# --- 命名空間驗證規則 ---
namespace_validation:
  enabled: false    # 未來功能
  rules:
    # 最小層級深度
    min_depth: 3
    # 最大層級深度
    max_depth: 8
    # 禁止的字元
    forbidden_chars: ["#", "+", " ", "　"]
    # 必須以企業名稱開頭
    required_prefix: "TaiwanPrecision"
    # 第六層必須是標準類別
    required_categories:
      - "Telemetry"
      - "Status"
      - "Alarm"
      - "Event"
      - "Command"
      - "Config"
      - "Metrics"
      - "Maintenance"
      - "Batch"
      - "Raw"

# --- 告警閾值設定（未來功能）---
alert_rules:
  enabled: false
  rules:
    - name: "溫度過高警告"
      topic_pattern: "**/Telemetry/Temperature"
      condition:
        field: "value"
        operator: ">"
        threshold: 80
        unit: "°C"
      severity: "warning"
      cooldown_seconds: 300

    - name: "設備離線告警"
      topic_pattern: "**/Status/MachineState"
      condition:
        field: "state"
        operator: "=="
        value: "fault"
      severity: "critical"
      cooldown_seconds: 60

    - name: "良率低於目標"
      topic_pattern: "**/Metrics/OEE"
      condition:
        field: "quality"
        operator: "<"
        threshold: 0.95
      severity: "warning"
      cooldown_seconds: 1800

# --- Dashboard 設定 ---
dashboard:
  title: "UNS Explorer"
  language: "zh-TW"
  # 自動刷新間隔
  refresh_interval_seconds: 10
  # 搜尋過濾
  search:
    max_display_topics: 500    # 超過此數量需要搜尋過濾
    default_expanded: false     # 預設不展開樹狀節點
  # 顯示設定
  display:
    max_payload_display_bytes: 10240  # 超過 10KB 的 payload 截斷顯示
    json_indent: 2
    show_binary_as_hex: true
    show_timestamps_local: true
    timezone: "Asia/Taipei"
