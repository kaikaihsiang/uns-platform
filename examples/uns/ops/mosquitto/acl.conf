# /etc/mosquitto/acl.conf
# ═══════════════════════════════════════════════════════════
# UNS MQTT Broker — 設備級存取控制清單 (Access Control List)
# ═══════════════════════════════════════════════════════════
#
# 原則：
#   1. 每台設備一個 MQTT user
#   2. 設備只能 publish 自己的 Telemetry/Status/Alarm
#   3. 設備不能訂閱任何 topic（防止竊聽）
#   4. 設備不能 publish 到 Command/Config topic（防止冒充指令）
#   5. Consumer 只能訂閱，不能 publish
#   6. CDC Transform 只能 publish Event/Status
#
# 新增設備時：
#   1. mosquitto_passwd /etc/mosquitto/passwords <new-user>
#   2. 在此檔案新增 user + topic 規則
#   3. 重載 Broker: mosquitto -s HUP <pid>  或重啟
#


# ─── SMT Line1 設備 ────────────────────────────────────────

# 錫膏印刷機
user printer-line1
topic write TaiwanPrecision/Taoyuan/SMT/Line1/Printer/Telemetry/#
topic write TaiwanPrecision/Taoyuan/SMT/Line1/Printer/Status/#
topic write TaiwanPrecision/Taoyuan/SMT/Line1/Printer/Alarm/#

# 貼片機
user pickandplace-line1
topic write TaiwanPrecision/Taoyuan/SMT/Line1/PickAndPlace/Telemetry/#
topic write TaiwanPrecision/Taoyuan/SMT/Line1/PickAndPlace/Status/#
topic write TaiwanPrecision/Taoyuan/SMT/Line1/PickAndPlace/Alarm/#

# 迴焊爐
user reflowoven-line1
topic write TaiwanPrecision/Taoyuan/SMT/Line1/ReflowOven/Telemetry/#
topic write TaiwanPrecision/Taoyuan/SMT/Line1/ReflowOven/Status/#
topic write TaiwanPrecision/Taoyuan/SMT/Line1/ReflowOven/Alarm/#


# ─── Assembly Line1 設備 ───────────────────────────────────

# 六軸機器人
user robot1-assembly-line1
topic write TaiwanPrecision/Taoyuan/Assembly/Line1/Robot1/Telemetry/#
topic write TaiwanPrecision/Taoyuan/Assembly/Line1/Robot1/Status/#
topic write TaiwanPrecision/Taoyuan/Assembly/Line1/Robot1/Alarm/#


# ─── QualityControl 設備 ──────────────────────────────────

# AOI 自動光學檢測
user aoi-inspection1
topic write TaiwanPrecision/Taoyuan/QualityControl/Inspection1/AOI/Telemetry/#
topic write TaiwanPrecision/Taoyuan/QualityControl/Inspection1/AOI/Status/#
topic write TaiwanPrecision/Taoyuan/QualityControl/Inspection1/AOI/Alarm/#
topic write TaiwanPrecision/Taoyuan/QualityControl/Inspection1/AOI/Event/#


# ─── Hsinchu Lab 設備 ─────────────────────────────────────

# 恆溫恆濕試驗箱
user tempchamber1-hsinchu
topic write TaiwanPrecision/Hsinchu/Lab/EnvTest/TempChamber1/Telemetry/#
topic write TaiwanPrecision/Hsinchu/Lab/EnvTest/TempChamber1/Status/#
topic write TaiwanPrecision/Hsinchu/Lab/EnvTest/TempChamber1/Alarm/#


# ─── UNS Consumer（只讀） ─────────────────────────────────
# Consumer 訂閱全部 topic，寫入 TimescaleDB
# 不允許 publish（防止資料回寫汙染）

user uns-consumer-01
topic read TaiwanPrecision/#

user uns-consumer-02
topic read TaiwanPrecision/#

user uns-consumer-03
topic read TaiwanPrecision/#


# ─── CDC Transform Service ────────────────────────────────
# 從 MES DB (Debezium) 讀取變更，轉換後 publish 到 UNS
# 只允許 publish Event 和 Status（MES 事件的兩種輸出）

user cdc-transform-01
topic write TaiwanPrecision/+/+/+/+/Event/#
topic write TaiwanPrecision/+/+/+/+/Status/#


# ─── Dashboard / 監控系統（只讀） ─────────────────────────

user dashboard-01
topic read TaiwanPrecision/#

user grafana-monitor
topic read TaiwanPrecision/#
topic read $SYS/#


# ─── 管理員（全權限，僅供維運/除錯） ─────────────────────
# ⚠ 此帳號僅供系統管理員使用，密碼需定期更換

user uns-admin
topic readwrite #
