# ═══════════════════════════════════════════════════════════
# Prometheus 告警規則 — UNS 監控
# ═══════════════════════════════════════════════════════════
#
# 告警嚴重程度：
#   critical — 立即需要處理（production 爆了）
#   warning  — 需要注意（可能即將出問題）
#   info     — 參考資訊

groups:

  # ═══ MQTT Broker 告警 ═══════════════════════════════════
  - name: mqtt_broker
    rules:

      - alert: MQTTBrokerDown
        expr: up{job="mosquitto"} == 0
        for: 1m
        labels:
          severity: critical
          component: mqtt-broker
        annotations:
          summary: "MQTT Broker 無法連線"
          description: "mosquitto-exporter 超過 1 分鐘無法連到 MQTT Broker"

      - alert: MQTTClientsDropped
        expr: mosquitto_clients_connected < 3
        for: 5m
        labels:
          severity: warning
          component: mqtt-broker
        annotations:
          summary: "MQTT 活躍設備數低於預期 (目前 {{ $value }})"
          description: "可能有多台設備離線，檢查 OT 網路和設備狀態"
          # ⚠ 請依實際設備數修改閾值

      - alert: MQTTNoMessagesReceived
        expr: rate(mosquitto_messages_received_total[5m]) == 0
        for: 5m
        labels:
          severity: critical
          component: mqtt-broker
        annotations:
          summary: "MQTT Broker 超過 5 分鐘沒收到任何訊息"
          description: "所有設備都停止送資料，或 Broker 有問題"

      - alert: MQTTConnectionsRejected
        expr: increase(mosquitto_connections_rejected_total[5m]) > 0
        labels:
          severity: warning
          component: mqtt-broker
        annotations:
          summary: "MQTT 有連線被拒絕 ({{ $value }} 次)"
          description: "可能是認證失敗（密碼錯誤/ACL 違規），檢查 Broker 日誌"


  # ═══ UNS Consumer 告警 ═════════════════════════════════
  - name: uns_consumer
    rules:

      - alert: ConsumerDown
        expr: up{job="uns-consumer"} == 0
        for: 1m
        labels:
          severity: critical
          component: consumer
        annotations:
          summary: "UNS Consumer 無法連線"
          description: "Consumer 的 metrics endpoint (:8000) 無回應"

      - alert: ConsumerNotProcessing
        expr: rate(uns_consumer_messages_total[5m]) == 0
        for: 5m
        labels:
          severity: critical
          component: consumer
        annotations:
          summary: "UNS Consumer 超過 5 分鐘沒處理任何訊息"
          description: "可能是 MQTT 連線斷了、或 Consumer hang 住"

      - alert: ConsumerHighErrorRate
        expr: >
          rate(uns_consumer_messages_errors_total[5m])
          / rate(uns_consumer_messages_total[5m])
          > 0.05
        for: 3m
        labels:
          severity: critical
          component: consumer
        annotations:
          summary: "UNS Consumer 錯誤率超過 5%"
          description: "每 100 筆訊息有超過 5 筆處理失敗"

      - alert: ConsumerSlowProcessing
        expr: histogram_quantile(0.99, rate(uns_consumer_processing_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          component: consumer
        annotations:
          summary: "UNS Consumer P99 處理時間超過 500ms"
          description: "資料寫入 TimescaleDB 可能變慢，檢查 DB 效能"

      - alert: ConsumerDBDisconnected
        expr: uns_consumer_db_connected == 0
        for: 30s
        labels:
          severity: critical
          component: consumer
        annotations:
          summary: "UNS Consumer 與 TimescaleDB 斷線"
          description: "Consumer 無法寫入資料，所有訊息將遺失"

      - alert: ConsumerSchemaValidationFailures
        expr: rate(uns_consumer_schema_validation_failures_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          component: consumer
        annotations:
          summary: "Schema 驗證失敗 ({{ $value }}/s)"
          description: "有設備送的 payload 格式不符合註冊的 schema"


  # ═══ CDC Pipeline 告警 ═════════════════════════════════
  - name: cdc_pipeline
    rules:

      - alert: CDCTransformDown
        expr: up{job="cdc-transform"} == 0
        for: 1m
        labels:
          severity: critical
          component: cdc-transform
        annotations:
          summary: "CDC Transform Service 無法連線"

      - alert: CDCHighLatency
        expr: uns_cdc_transform_lag_seconds > 60
        for: 5m
        labels:
          severity: warning
          component: cdc-transform
        annotations:
          summary: "CDC 延遲超過 60 秒 (目前 {{ $value }}s)"
          description: "MES DB 的變更超過 1 分鐘還沒反映到 UNS"

      - alert: CDCTransformErrors
        expr: rate(uns_cdc_transform_errors_total[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
          component: cdc-transform
        annotations:
          summary: "CDC Transform 持續有錯誤"
          description: "MES 事件轉換失敗，檢查 transform rules"


  # ═══ TimescaleDB 告警 ══════════════════════════════════
  - name: timescaledb
    rules:

      - alert: TimescaleDBDown
        expr: up{job="timescaledb"} == 0
        for: 1m
        labels:
          severity: critical
          component: timescaledb
        annotations:
          summary: "TimescaleDB 無法連線"

      - alert: TimescaleDBDiskUsageHigh
        expr: pg_database_size_bytes{datname="uns_timeseries"} > 50e9
        for: 10m
        labels:
          severity: warning
          component: timescaledb
        annotations:
          summary: "TimescaleDB 資料庫大小超過 50GB"
          description: "檢查 retention policy 是否正常執行"
          # ⚠ 請依實際磁碟大小調整閾值

      - alert: TimescaleDBConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
          component: timescaledb
        annotations:
          summary: "TimescaleDB 連線數偏高 ({{ $value }})"
          description: "接近 max_connections 上限，可能需要連線池"

      - alert: TimescaleDBSlowQueries
        expr: pg_stat_activity_max_tx_duration{datname="uns_timeseries"} > 30
        for: 5m
        labels:
          severity: warning
          component: timescaledb
        annotations:
          summary: "TimescaleDB 有超過 30 秒的慢查詢"
          description: "檢查是否有 lock contention 或缺少索引"
