# retention_policy.yaml — UNS 資料保留策略設定
#
# 此檔案定義各 Category 的資料保留期限、降取樣策略、以及過期處理方式。
# 使用 apply_retention.py 腳本將此設定自動套用到 TimescaleDB。
#
# 用法：
#   python apply_retention.py --config retention_policy.yaml --db-url postgresql://uns:password@localhost:5432/uns_timeseries
#
# 修改後重新執行即可更新（腳本會先移除舊 policy 再建新的）。

retention:

  # ═══════════════════════════════════════════════════════════
  # 每種 Category 的保留期限
  # ═══════════════════════════════════════════════════════════
  #
  # 參數說明：
  #   raw          — 原始資料保留天數
  #   downsampled  — 降取樣的保留設定（僅 Telemetry 需要）
  #   on_expiry    — 過期處理方式：archive（歸檔後刪除）或 delete（直接刪除）

  telemetry:
    table: ts_telemetry
    raw: 30                      # 30 天原始資料
    downsampled:
      - interval: 1 minute       # 1 分鐘平均
        retention: 365            # 保留 1 年
        view_name: telemetry_1min
        refresh_interval: 1 hour
        refresh_start_offset: 2 hours
        refresh_end_offset: 1 hour
      - interval: 1 hour         # 1 小時平均
        retention: 1825           # 保留 5 年
        view_name: telemetry_1hr
        source: telemetry_1min    # 從 1min 聚合再聚合（cascade）
        refresh_interval: 1 hour
        refresh_start_offset: 3 hours
        refresh_end_offset: 1 hour
    on_expiry: archive

  status:
    table: ts_status
    raw: 365                     # 1 年
    downsampled: []              # 狀態不降取樣
    on_expiry: archive

  alarm:
    table: ts_alarms
    raw: 1825                    # 5 年（法規要求）
    downsampled: []
    on_expiry: archive           # 告警紀錄必須歸檔，不可直接刪

  event:
    table: ts_events
    raw: 1825                    # 5 年（traceability）
    downsampled: []
    on_expiry: archive

  metrics:
    table: ts_metrics
    raw: 730                     # 2 年
    downsampled: []
    on_expiry: delete            # OEE 歷史超期可直接刪


  # ═══════════════════════════════════════════════════════════
  # Cold Storage 歸檔設定
  # ═══════════════════════════════════════════════════════════

  archive:
    enabled: true
    backend: s3                  # s3 | nas | minio

    s3:
      bucket: uns-archive
      region: ap-northeast-1
      endpoint_url: ~            # MinIO 時填入，如 http://minio:9000
      prefix: "{enterprise}/{site}/{year}/{month}/"

    nas:
      mount_path: /mnt/archive/uns
      path_format: "{enterprise}/{site}/{year}/{month}/"

    format: parquet              # parquet | csv
    compression: snappy          # snappy | gzip | none

    # 歸檔完成且驗證通過後，是否從 TimescaleDB 刪除
    delete_after_archive: true

    # 歸檔排程（供 cron 參考，腳本本身不排程）
    schedule: "0 2 1 * *"        # 每月 1 號凌晨 2 點
